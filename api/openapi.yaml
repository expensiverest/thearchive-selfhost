openapi: 3.1.0
info:
  title: Music Workspace Server API
  version: 0.3.0
  description: |
    Versioned contract for the self-hosted server API (product API "1.0", advertised in the
    discovery response). This file is the source of truth for generated TypeScript clients in
    `packages/api-client`; a drift test keeps them in sync.

    **Implementation status:** no routes are deployed yet. Implementations land per task:
    auth/projects/library in P0-06, uploads/media in P0-07, sync in P0-08. Until a route's
    access policy is tested (see `docs/security/permissions-contract.md`), it stays
    contract-only.
  x-contract-status: v1 draft (P0-05) - routes implemented from P0-06 onward
servers:
  - url: "{installationBaseUrl}"
    description: |
      A self-hosted installation. Clients discover the concrete base path from
      `/.well-known/music-workspace` (`api_base`, currently `/api/v1`).
    variables:
      installationBaseUrl:
        default: https://example.invalid
security:
  - bearerAuth: []
tags:
  - name: discovery
    description: Public installation metadata (no authentication).
  - name: auth
    description: Invitation-only accounts and sessions (P0-06).
  - name: admin
    description: Instance-administrator-only user management.
  - name: projects
    description: Projects, membership and roles (P0-06).
  - name: library
    description: Folders, songs, variants and immutable revision selection (P0-06).
  - name: uploads
    description: Resumable chunked uploads with checksum verification (P0-07).
  - name: media
    description: Blob manifests and chunk streams (P0-07).
  - name: sync
    description: Cursor-based change feed and idempotent mutations (P0-08).
paths:
  /api/v1/auth/account:
    delete:
      operationId: deleteAccount
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, maxLength: 1024 }
      responses:
        "204": { description: Account deleted or anonymised; all sessions revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: owns_shared_projects (transfer ownership or remove other active members), or last_admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Rate limited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/admin/users:
    get:
      tags: [admin]
      operationId: listAdminUsers
      responses:
        "200":
          description: Instance users (invited placeholders excluded)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/users/{user_id}:
    patch:
      tags: [admin]
      operationId: updateAdminUser
      parameters:
        - in: path
          name: user_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                status: { type: string, enum: [active, disabled] }
                storage_quota_bytes: { type: [integer, "null"], minimum: 0 }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
