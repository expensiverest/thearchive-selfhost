      tags: [auth]
      summary: Revoke the current session (logout) (P0-06)
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags: [auth]
      summary: Accept an invitation, set a password and open a session (P0-06)
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Invitation token from the invite link.
      requestBody:
