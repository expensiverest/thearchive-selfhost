  /.well-known/music-workspace:
    get:
      operationId: getWellKnownMusicWorkspace
      tags: [discovery]
      summary: Public installation discovery (proposed route; may change before its implementation)
      description: |
        Unauthenticated metadata used by clients to validate HTTPS, check the installation ID and
        API compatibility before authenticating. Must not leak tokens.
      security: []
      responses:
        "200":
          description: Installation metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerDiscovery"

  /api/v1/auth/sessions:
    post:
      operationId: createSession
      tags: [auth]
      summary: Sign in with email and password (P0-06)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreate"
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/sessions/current:
